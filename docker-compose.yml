services:
  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-paste:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pastedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-paste-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pastedb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  authservice:
    build:
      context: .
      dockerfile: Services/AuthService/Dockerfile
    ports:
      - "5279:8080"
    environment:
      ConnectionStrings__Default: "Host=postgres-auth;Database=authdb;Username=postgres;Password=postgres"
    depends_on:
      postgres-auth:
        condition: service_healthy
    restart: unless-stopped

  pasteservice:
    build:
      context: .
      dockerfile: Services/PasteService/Dockerfile
    ports:
      - "5065:8080"
    environment:
      ConnectionStrings__Default: "Host=postgres-paste;Database=pastedb;Username=postgres;Password=postgres"
    depends_on:
      postgres-paste:
        condition: service_healthy
    restart: unless-stopped

  apigateway:
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
    ports:
      - "5179:8080"
    depends_on:
      - authservice
      - pasteservice
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
      args:
        VITE_API_URL: "http://localhost:5179"
    ports:
      - "5173:80"
    depends_on:
      - apigateway
    restart: unless-stopped

volumes:
  postgres-auth-data:
  postgres-paste-data:
